version: "3.8"

services:
  usc-postgres:
    image: postgres:16-alpine
    container_name: usc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usc
      POSTGRES_PASSWORD: "${USC_DB_PASSWORD:?ustaw USC_DB_PASSWORD w .env (losowe, patrz docs/INSTALL.md)}"
      POSTGRES_DB: usc
    volumes:
      - usc-postgres-data:/var/lib/postgresql/data
    networks:
      - usc-net

  usc-backend:
    build: ./backend
    image: usc-backend:latest
    container_name: usc-backend
    restart: unless-stopped
    environment:
      USC_DATABASE_URL: "postgresql://usc:${USC_DB_PASSWORD}@usc-postgres:5432/usc"
      USC_ADMIN_USER: "${USC_ADMIN_USER:?ustaw USC_ADMIN_USER w .env}"
      USC_ADMIN_PASSWORD: "${USC_ADMIN_PASSWORD:?ustaw USC_ADMIN_PASSWORD w .env (losowe)}"
      USC_INTERNAL_TOKEN: "${USC_INTERNAL_TOKEN:?ustaw USC_INTERNAL_TOKEN w .env (losowy, wspoldzielony z kolektorem)}"
      # Jednorazowe seedowanie panelu przy pierwszym starcie (migracja z .env) -
      # po pierwszym boocie edytuj te wartosci w panelu /settings, nie tutaj.
      USC_SEED_UNRAID_HOST: "${USC_UNRAID_HOST}"
      USC_SEED_UNRAID_API_KEY: "${USC_UNRAID_API_KEY}"
      USC_SEED_TELEGRAM_BOT_TOKEN: "${USC_TELEGRAM_BOT_TOKEN}"
      USC_SEED_TELEGRAM_CHAT_ID: "${USC_TELEGRAM_CHAT_ID}"
    depends_on:
      - usc-postgres
    ports:
      - "${USC_WEB_PORT:-8420}:8000"
    volumes:
      - usc-keys-data:/app/keys
    networks:
      - usc-net

  usc-collector:
    build: ./collector
    image: usc-collector:latest
    container_name: usc-collector
    restart: unless-stopped
    environment:
      USC_BACKEND_URL: "http://usc-backend:8000"
      USC_INTERNAL_TOKEN: "${USC_INTERNAL_TOKEN:?ustaw USC_INTERNAL_TOKEN w .env (ta sama wartosc co w backendzie)}"
      USC_POLL_SECONDS: "${USC_POLL_SECONDS:-60}"
      USC_SMART_POLL_SECONDS: "${USC_SMART_POLL_SECONDS:-600}"
      USC_DOCKER_HEALTH_POLL_SECONDS: "${USC_DOCKER_HEALTH_POLL_SECONDS:-300}"
      USC_SYSLOG_PREVIOUS_POLL_SECONDS: "${USC_SYSLOG_PREVIOUS_POLL_SECONDS:-900}"
      USC_VM_POLL_SECONDS: "${USC_VM_POLL_SECONDS:-180}"
    depends_on:
      - usc-backend
    volumes:
      - usc-keys-data:/app/keys
    networks:
      - usc-net

networks:
  usc-net:
    driver: bridge

volumes:
  usc-postgres-data:
  usc-keys-data:
